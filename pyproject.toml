[project]
name = "ragnostic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "bm25s>=0.3.10",
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "langchain-community<0.4.2",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.4",
    "numpy>=2.5.1",
    "openai>=2.53.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.5",
    "requests>=2.34.2",
    "sqlalchemy>=2.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = [
    "anthropic>=0.121.0",
    "lxml>=6.1.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
